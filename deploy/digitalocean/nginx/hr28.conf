# HR28 behind Cloudflare:  visitor -> Cloudflare -> Nginx (this file) -> web app 127.0.0.1:5000
# The API (127.0.0.1:5001) is NOT published here: only the web app talks to it.
# Install: /etc/nginx/sites-available/hr28  (+ link in sites-enabled), then: nginx -t && systemctl reload nginx
# Replace shamheed.com if the client's domain changes.

server {
    listen 80;
    listen [::]:80;
    server_name shamheed.com www.shamheed.com;

    include /etc/nginx/snippets/hr28-cloudflare-real-ip.conf;

    return 301 https://shamheed.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shamheed.com www.shamheed.com;

    # Cloudflare Origin Certificate (Cloudflare SSL mode: Full (strict)).
    ssl_certificate     /etc/ssl/hr28/origin.pem;
    ssl_certificate_key /etc/ssl/hr28/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/hr28-cloudflare-real-ip.conf;

    # Voter list uploads are up to 20 MB; photos are made small on the device first.
    client_max_body_size 25m;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The visitor's real address (taken from Cloudflare above) and that it came over HTTPS.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long voter list uploads.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
