# HR28 server SSH rules: /etc/ssh/sshd_config.d/10-hr28.conf (read before the cloud-init files,
# so these win). Keys only; the owner's PuTTY key keeps working.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
